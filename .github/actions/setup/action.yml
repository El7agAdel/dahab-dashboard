name: Setup
description: Node from .nvmrc and a cached npm install.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    # .npmrc sets ignore-scripts, so no dependency runs code while installing
    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
